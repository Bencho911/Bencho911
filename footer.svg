<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="footer">
<defs>
  <linearGradient id="f1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c4a7e7"/><stop offset=".5" stop-color="#9ccfd8"/><stop offset="1" stop-color="#ebbcba"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="m"><rect width="1200" height="160" fill="url(#fade)"/></mask>
  <!-- onda periódica de 600px, se repite para poder deslizarla sin cortes -->
  <path id="w" d="M0 0 C150 -26 150 26 300 0 S450 -26 600 0 S750 26 900 0 S1050 -26 1200 0 S1350 26 1500 0 S1650 -26 1800 0 V200 H0 Z"/>
</defs>
<style>
  .l1 { animation: s 14s linear infinite }
  .l2 { animation: s 9s linear infinite reverse }
  .l3 { animation: s 20s linear infinite }
  @keyframes s { from { transform: translateX(0) } to { transform: translateX(-600px) } }
  .t  { font: 500 14px ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; fill:#e0def4; letter-spacing:3px;
        animation: glow 4s ease-in-out infinite }
  @keyframes glow { 0%,100% { opacity:.55 } 50% { opacity:1 } }
  .st { animation: tw 3s ease-in-out infinite }
  @keyframes tw { 0%,100% { opacity:.1 } 50% { opacity:.9 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<g mask="url(#m)">
  <g transform="translate(0 70)"><use href="#w" class="l3" fill="#c4a7e7" opacity=".12"/></g>
  <g transform="translate(0 88)"><use href="#w" class="l2" fill="#9ccfd8" opacity=".14"/></g>
  <g transform="translate(0 104)"><use href="#w" class="l1" fill="#26233a"/></g>
  <g transform="translate(0 112)"><use href="#w" class="l2" fill="#191724"/></g>
</g>
<circle class="st" cx="180" cy="40" r="1.3" fill="#e0def4"/>
<circle class="st" cx="1010" cy="30" r="1.5" fill="#c4a7e7" style="animation-delay:-1.2s"/>
<circle class="st" cx="420" cy="22" r="1" fill="#9ccfd8" style="animation-delay:-2s"/>
<circle class="st" cx="820" cy="52" r="1.1" fill="#ebbcba" style="animation-delay:-.6s"/>
<text class="t" x="600" y="142" text-anchor="middle">✦  gracias por pasar  ✦</text>
</svg>

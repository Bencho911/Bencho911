<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="ahora mismo">
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#211e33"/><stop offset="1" stop-color="#191724"/>
  </linearGradient>
  <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#c4a7e7" stop-opacity=".15"/><stop offset=".5" stop-color="#c4a7e7" stop-opacity=".7"/>
    <stop offset="1" stop-color="#c4a7e7" stop-opacity=".15"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .c   { animation: in .9s cubic-bezier(.2,.8,.2,1) both }
  .c2  { animation-delay: .15s } .c3 { animation-delay: .3s } .c4 { animation-delay: .45s }
  @keyframes in { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform:none } }
  .lab { font: 600 12px ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing:3px; fill:#6e6a86 }
  .val { font: 600 19px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill:#e0def4 }
  .dot { animation: pulse 2s ease-in-out infinite }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  .bar { transform-box: fill-box; transform-origin: bottom; animation: eq .9s ease-in-out infinite alternate }
  @keyframes eq { from { transform: scaleY(.25) } to { transform: scaleY(1) } }
  .blink { animation: b 1s steps(1) infinite } @keyframes b { 50% { opacity:0 } }
  .spin { transform-box: fill-box; transform-origin: center; animation: r 6s linear infinite }
  @keyframes r { to { transform: rotate(360deg) } }
  .page { transform-box: fill-box; transform-origin: left; animation: flip 3.5s ease-in-out infinite }
  @keyframes flip { 0%,60%,100% { transform: scaleX(1) } 80% { transform: scaleX(-1) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>

<!-- ══ 1. construyendo ══ -->
<g transform="translate(12 12)">
  <g class="c">
  <rect width="276" height="166" rx="18" fill="url(#card)" stroke="url(#edge)"/>
  <circle class="dot" cx="250" cy="28" r="4" fill="#9ccfd8"/>
  <text x="26" y="62" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#c4a7e7">&lt;/&gt;<tspan class="blink" fill="#c4a7e7">_</tspan></text>
  <text class="lab" x="26" y="110">CONSTRUYENDO</text>
  <text class="val" x="26" y="140">tu proyecto actual</text> <!-- ← edita aquí -->
  </g>
</g>

<!-- ══ 2. aprendiendo ══ -->
<g transform="translate(308 12)">
  <g class="c c2">
  <rect width="276" height="166" rx="18" fill="url(#card)" stroke="url(#edge)"/>
  <g transform="translate(26 30)">
    <path class="spin" d="M17 0 C18.5 12 22 15.5 34 17 C22 18.5 18.5 22 17 34 C15.5 22 12 18.5 0 17 C12 15.5 15.5 12 17 0Z" fill="#9ccfd8"/>
  </g>
  <text class="lab" x="26" y="110">APRENDIENDO</text>
  <text class="val" x="26" y="140">arquitectura &amp; cloud</text> <!-- ← edita aquí -->
  </g>
</g>

<!-- ══ 3. escuchando ══ -->
<g transform="translate(604 12)">
  <g class="c c3">
  <rect width="276" height="166" rx="18" fill="url(#card)" stroke="url(#edge)"/>
  <g transform="translate(26 30)" fill="#ebbcba">
    <rect class="bar" x="0"  y="0" width="6" height="34" rx="3"/>
    <rect class="bar" x="10" y="0" width="6" height="34" rx="3" style="animation-delay:-.3s;animation-duration:.7s"/>
    <rect class="bar" x="20" y="0" width="6" height="34" rx="3" style="animation-delay:-.6s;animation-duration:1.1s"/>
    <rect class="bar" x="30" y="0" width="6" height="34" rx="3" style="animation-delay:-.15s;animation-duration:.8s"/>
  </g>
  <text class="lab" x="26" y="110">ESCUCHANDO</text>
  <text class="val" x="26" y="140">lo-fi para programar</text> <!-- ← edita aquí -->
  </g>
</g>

<!-- ══ 4. leyendo ══ -->
<g transform="translate(900 12)">
  <g class="c c4">
  <rect width="276" height="166" rx="18" fill="url(#card)" stroke="url(#edge)"/>
  <g transform="translate(26 30)" fill="none" stroke="#e0def4" stroke-width="2.2" stroke-linejoin="round">
    <path d="M18 6 C12 2 5 2 1 4 V32 C5 30 12 30 18 34 Z"/>
    <path class="page" d="M18 6 C24 2 31 2 35 4 V32 C31 30 24 30 18 34 Z" stroke="#c4a7e7"/>
  </g>
  <text class="lab" x="26" y="110">LEYENDO</text>
  <text class="val" x="26" y="140">clean architecture</text> <!-- ← edita aquí -->
  </g>
</g>
</svg>

name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 horas
  workflow_dispatch:          # botón manual en la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generar svgs de la serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#907aa9&color_dots=#f2e9e1,#e4dcf0,#c4a7e7,#a08ac9,#907aa9
            dist/github-snake-dark.svg?color_snake=#ebbcba&color_dots=#1f1d2e,#2a2540,#524f67,#9a85c9,#c4a7e7

      - name: publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
